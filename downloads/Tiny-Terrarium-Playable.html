</style></head><body class="guided" data-stage="soil"><main id="game" aria-label="Step by step terrarium game">
<div class="room-light" aria-hidden="true"></div><div class="window window-one" aria-hidden="true"></div><div class="window window-two" aria-hidden="true"></div>
<header class="topbar"><div class="shop-brand"><div class="seal" id="seal" aria-hidden="true"></div><span>TINY TERRARIUM</span></div><div class="utilities"><button id="undo" class="round-button" aria-label="Undo last action"></button><button id="reset" class="round-button" aria-label="Start a new terrarium"></button></div></header>
<section class="workshop" aria-label="Greenhouse workbench"><div class="shop-arch" aria-hidden="true"></div>
<aside id="plant-panel" class="plant-cabinet" aria-label="Plant selection" hidden><div class="cabinet-crown"></div><div id="plant-shelf" class="plant-shelf"></div><div class="cabinet-feet"></div></aside>
<section class="bottle-station" aria-label="Terrarium"><div class="lamps" id="lamps" aria-hidden="true"></div><div class="light-cone" aria-hidden="true"></div><div class="jar-halo" aria-hidden="true"></div><div class="bottle-wrap"><div id="bottle" class="bottle"></div><div id="drop-targets" class="drop-targets"></div></div><div class="bottle-coaster" aria-hidden="true"></div></section>
<aside id="creature-panel" class="guided-creatures" aria-label="Creature selection" hidden><div id="creature-boxes" class="creature-boxes"></div><div class="small-shelf" aria-hidden="true"></div></aside>
<button id="sprayer" class="sprayer object-button" aria-label="Water your terrarium and grow plants" hidden></button>
<section id="soil-panel" class="soil-drawer" aria-label="Soil selection"><div id="trowel" class="trowel" aria-hidden="true"></div><div id="soils" class="soils" role="group" aria-label="Choose soil"></div></section>
<div id="growth-dots" class="growth-dots" aria-hidden="true" hidden></div>
</section><div class="bench-edge" aria-hidden="true"></div><div class="floor" aria-hidden="true"></div><div id="carried" class="carried" aria-hidden="true"></div><div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="reset-dialog" aria-label="Start a new terrarium?"><div id="reset-picture" class="reset-picture"></div><div class="dialog-actions"><button id="cancel-reset" class="round-button" aria-label="Keep terrarium"></button><button id="confirm-reset" class="round-button" aria-label="Confirm reset"></button></div></dialog>
</main><script type="module">// All ecological rules live here. Rendering never changes simulation state.
const SOILS = {
  sandy: { name: 'Sandy soil', retention: 'Low retention', description: 'Loose and airy; water drains away quickly.', evaporation: 1.35, color: '#b09167' },
  regular: { name: 'Regular soil', retention: 'Balanced retention', description: 'A balanced mix that holds a moderate amount of water.', evaporation: 1, color: '#816044' },
  humus: { name: 'Humus-rich soil', retention: 'High retention', description: 'Rich in organic matter; stays moist for longer.', evaporation: .65, color: '#5f4936' }
};
const SPECIES = {
  moss: { name: 'Moss', moisture: [50, 85], light: [15, 55], detail: 'A soft carpet for a shady, moist world.' },
  fern: { name: 'Fern', moisture: [40, 75], light: [25, 65], detail: 'Feathery fronds that love gentle light.' },
  foliage: { name: 'Small foliage', moisture: [30, 65], light: [40, 80], detail: 'Little leaves that enjoy a brighter spot.' }
};
const CREATURES = { springtails: {name:'Springtails', moisture:[40,85], description:'Tiny recyclers that feed on decaying matter.'}, woodlice:{name:'Woodlice', moisture:[35,75], description:'Little decomposers that break down fallen leaves.'} };
const clamp = (n, min=0, max=100) => Math.max(min, Math.min(max,n));
const level = n => n < 35 ? 'Low' : n <= 70 ? 'Moderate' : 'High';
const condition = n => n >= 75 ? 'Thriving' : n >= 50 ? 'Settling in' : n >= 25 ? 'Stressed' : 'Struggling';
const freshState = () => ({step:0, unlocked:0, selectedSoil:'regular', soil:null, selectedPlant:'fern', plants:[null,null,null], creatures:[], creatureChoice:false, creatureHealth:90, moisture:55, light:50, initialWater:55, started:false, day:0, history:[], events:[], summarySeen:false, explanation:'Your world is ready. Advance one day to see how it responds.'});
const meanHealth = s => { const p=s.plants.filter(Boolean); return p.length?p.reduce((a,p)=>a+p.health,0)/p.length:100; };
const overall = s => condition(s.creatures.length ? (meanHealth(s)+s.creatureHealth)/2 : meanHealth(s));
const distance = (value,[lo,hi]) => Math.max(lo-value, value-hi, 0);
function advanceDay(s) {
  if(!s.started || !s.soil || !s.plants.some(Boolean)) return;
  // Percent moisture per day: soil multiplier × (2 + light × .055), plus plant use.
  const loss = SOILS[s.soil].evaporation*(2+s.light*.055)+s.plants.filter(Boolean).length*.35;
  s.moisture=clamp(s.moisture-loss); s.day++;
  s.plants.forEach(p=> {if(!p)return; const spec=SPECIES[p.species]; const stress=distance(s.moisture,spec.moisture)*.17+distance(s.light,spec.light)*.10;
    p.stressDays=stress>0?p.stressDays+1:0;
    p.health=clamp(p.health+(stress>0?-Math.min(15,2+stress+p.stressDays*.6):5));
    p.growth=clamp(p.growth+(stress===0? .035: -.012),.6,1.45);
  });
  if(s.creatures.length){const stress=Math.max(...s.creatures.map(c=>distance(s.moisture,CREATURES[c].moisture)));s.creatureHealth=clamp(s.creatureHealth+(stress?-(2+stress*.2):4));}
  const thirsty=s.plants.find(p=>p&&s.moisture<SPECIES[p.species].moisture[0]);
  const wet=s.plants.find(p=>p&&s.moisture>SPECIES[p.species].moisture[1]);
  const bright=s.plants.find(p=>p&&s.light>SPECIES[p.species].light[1]);
  const dark=s.plants.find(p=>p&&s.light<SPECIES[p.species].light[0]);
  if(thirsty)s.explanation=`Moisture is below ${SPECIES[thirsty.species].name.toLowerCase()}'s preferred range. Add a little water to help it recover.`;
  else if(wet)s.explanation=`The soil is too wet for ${SPECIES[wet.species].name.toLowerCase()}. Hold off on watering while moisture falls.`;
  else if(bright)s.explanation='Strong light is stressing a plant and increasing water loss. Try reducing the light level.';
  else if(dark)s.explanation=`${SPECIES[dark.species].name} needs more light. Increase the light toward its preferred range.`;
  else if(s.creatures.length&&s.creatureHealth<75)s.explanation='Your plants are comfortable, but the decomposers are still recovering. Keep moisture within their preferred range.';
  else s.explanation=`Your plants are within their preferred ranges and recovering or growing. ${SOILS[s.soil].name} lost ${loss.toFixed(1)} moisture points today.`;
  s.history.push({day:s.day,moisture:s.moisture,light:s.light,health:meanHealth(s),condition:overall(s),explanation:s.explanation});
}
function water(s, amount=12) {const before=s.moisture;s.moisture=clamp(s.moisture+amount);s.events.push({day:s.day,type:'water',amount:s.moisture-before});return s.moisture-before;}

const PLANT_BED=[{x:210,y:317,name:'back left'},{x:280,y:310,name:'back middle'},{x:350,y:317,name:'back right'},{x:160,y:332,name:'far left'},{x:400,y:332,name:'far right'},{x:193,y:351,name:'front left'},{x:251,y:359,name:'front middle left'},{x:309,y:359,name:'front middle right'},{x:367,y:351,name:'front right'}];
const newWorld=()=>({...freshState(),plants:Array(PLANT_BED.length).fill(null),gameWatered:false});
const ready=s=>Boolean(s.soil&&s.plants.some(Boolean));
function weekReport(s){
 const plants=s.plants.filter(Boolean),health=Math.round(meanHealth(s));
 const average=Math.round(s.history.slice(0,7).reduce((sum,d)=>sum+d.health,0)/Math.max(1,Math.min(7,s.history.length)));
 const dry=plants.find(p=>s.moisture<SPECIES[p.species].moisture[0]),wet=plants.find(p=>s.moisture>SPECIES[p.species].moisture[1]);
 const bright=plants.find(p=>s.light>SPECIES[p.species].light[1]),dark=plants.find(p=>s.light<SPECIES[p.species].light[0]);
 const advice=dry?'The soil is getting dry. A little spray will help your plants recover.':wet?'The soil is holding a lot of water. Let it dry a little before spraying again.':bright?'The light is a little strong for your plants. Turn the dial down and watch them settle.':dark?'Your plants could use more light. Turn the dial up a little.':'Your plants have comfortable water and light. Keep watching as this little world grows.';
 return {title:health>=75?(dry||wet||bright||dark?'A promising little world.':'A little world in balance.'):health>=50?'Finding its own rhythm.':'A little care goes a long way.',summary:`Seven days with ${plants.length} ${plants.length===1?'plant':'plants'} and ${s.creatures.length} ${s.creatures.length===1?'kind':'kinds'} of tiny creatures. Average plant health was ${average}%. Every choice left a little trace.`,advice,health,moisture:Math.round(s.moisture),light:s.light,waterings:s.events.filter(e=>e.type==='water'&&e.day<=7).length};
}
// One action has one visible consequence. Invalid actions leave the world untouched.
function act(s,a){
 if(a.kind==='soil'&&SOILS[a.type]){s.soil=a.type;return true;}
 if(a.kind==='plant'&&s.soil&&SPECIES[a.type]&&Number.isInteger(a.slot)&&a.slot>=0&&a.slot<PLANT_BED.length){s.plants[a.slot]={species:a.type,health:90,growth:1,stressDays:0};s.started=true;return true;}
 if(a.kind==='remove'&&s.plants[a.slot]){s.plants[a.slot]=null;s.started=ready(s);return true;}
 if(a.kind==='creature'&&ready(s)&&CREATURES[a.type]){s.creatures=s.creatures.includes(a.type)?s.creatures.filter(c=>c!==a.type):[...s.creatures,a.type];return true;}
 if(a.kind==='water'&&s.soil){water(s);s.gameWatered=true;return true;}
 if(a.kind==='light'&&Number.isFinite(a.value)&&a.value>=0&&a.value<=100){s.light=Math.round(a.value);return true;}
 if(a.kind==='day'&&ready(s)){s.started=true;advanceDay(s);return true;}
 return false;
}

// Deterministic botanical drawing. Separate back/front passes let different plants interweave.
function botanicalPlant(type,health=90,layer='all',variant=0){
 const colors=health<30?['#a79a62','#847b4e','#c4b57a','#746d47']:health<60?['#8e9c63','#6c8051','#b7c486','#576b47']:['#779b55','#3e704c','#b1c977','#2c5944'];
 const [light,green,pale,dark]=colors;

const newGarden=()=>({...newWorld(),stage:'soil',light:50,sprays:0});
function gardenPanels(s){return {soil:s.stage==='soil',plants:(s.stage==='soil'&&Boolean(s.soil))||s.stage==='plants',creatures:(s.stage==='plants'&&s.plants.some(Boolean))||s.stage==='creatures',water:(s.stage==='creatures'&&s.creatures.length>0)||s.stage==='care'};}
function gardenAct(s,a){
 if(a.kind==='pickup'){const panels=gardenPanels(s),key={soil:'soil',plant:'plants',creature:'creatures',water:'water'}[a.type];if(!panels[key])return false;s.stage={soil:'soil',plant:'plants',creature:'creatures',water:'care'}[a.type];return true;}
 if(s.stage==='soil'&&a.kind==='soil'&&SOILS[a.type]){s.soil=a.type;return true;}
 if(s.stage==='plants'&&a.kind==='plant'&&SPECIES[a.type]&&Number.isInteger(a.slot)&&a.slot>=0&&a.slot<PLANT_BED.length){s.plants[a.slot]={species:a.type,health:90,growth:.68,stressDays:0};return true;}
 if(s.stage==='creatures'&&a.kind==='creature'&&CREATURES[a.type]){if(!s.creatures.includes(a.type))s.creatures.push(a.type);return true;}
 if(s.stage==='care'&&a.kind==='water'){s.sprays++;s.moisture=Math.min(85,s.moisture+4);s.plants.forEach(p=>{if(p){p.growth=Math.min(1.45,p.growth+.085);p.health=Math.min(100,p.health+2);}});return true;}
 return false;
}

function gardenJar(s,options={}){
 const scene=jar({...s,creatures:[]},options);
 const residents=s.creatures.map((type,k)=>[0,1].map(i=>{
 const x=type==='springtails'?183+i*110:250+i*112,y=type==='springtails'?329+i*7:331+i*3;
 return `<g class="visible-resident" data-resident="${type}" transform="translate(${x} ${y})"><g class="resident-walk" style="animation-delay:-${i*2+k}s">${bug(type,0,0,type==='springtails'?.88:.82)}</g></g>`;
 }).join('')).join('');
 return scene.replace('</svg>',`<g class="resident-foreground">${residents}</g></svg>`);
}

q('#seal').innerHTML=glyph('leaf');q('#undo').innerHTML=glyph('undo');q('#reset').innerHTML=glyph('reset');q('#cancel-reset').innerHTML=glyph('close');q('#confirm-reset').innerHTML=glyph('check');q('#trowel').innerHTML=trowel();q('#sprayer').innerHTML=sprayer();q('#lamps').innerHTML=pendant(50);
q('#plant-shelf').innerHTML=Object.entries(SPECIES).map(([type,p])=>`<div class="plant-row"><button class="plant-choice object-button" data-kind="plant" data-type="${type}" aria-label="Pick up ${p.name}" aria-pressed="false"><span class="plant-object">${pottedPlant(type)}</span><span class="specimen-card plant-card">${specimenCard(type)}</span></button></div>`).join('');
q('#soils').innerHTML=Object.entries(SOILS).map(([type,s])=>`<button class="soil-choice object-button" data-kind="soil" data-type="${type}" aria-label="Scoop ${s.name}" aria-pressed="false"><span class="soil-object">${soilTray(type)}</span><span class="specimen-card soil-card">${specimenCard(type)}</span></button>`).join('');
q('#creature-boxes').innerHTML=Object.entries(CREATURES).map(([type,c])=>`<button class="creature-box object-button" data-kind="creature" data-type="${type}" aria-label="Pick up ${c.name}" aria-pressed="false"><span class="insect-object">${bugBox(type)}</span><span class="specimen-card insect-card">${specimenCard(type)}</span></button>`).join('');
function announce(text){q('#announcement').textContent=text;}
function fit(){q('#game').style.setProperty('--scene-scale',Math.max(.25,Math.min((innerWidth-32)/1280,(innerHeight-88)/720)));}
function render(mist=false){
 document.body.dataset.stage=garden.stage;
 q('#bottle').innerHTML=gardenJar(garden,{water:mist,preview:selected?.kind==='plant'?selected:null});
 const panels=gardenPanels(garden);q('#plant-panel').hidden=!panels.plants;q('#soil-panel').hidden=!panels.soil;q('#creature-panel').hidden=!panels.creatures;q('#sprayer').hidden=!panels.water;
 q('#plant-panel').classList.toggle('upcoming',garden.stage==='soil'&&panels.plants);q('#creature-panel').classList.toggle('upcoming',garden.stage==='plants'&&panels.creatures);q('#sprayer').classList.toggle('upcoming',garden.stage==='creatures'&&panels.water);
 q('#drop-targets').innerHTML=`<button class="jar-target" aria-label="${garden.stage==='care'?'Water terrarium':selected?'Place selected object into terrarium':'Terrarium'}"></button>`+(selected?.kind==='plant'?PLANT_BED.map((bed,i)=>`<button class="plant-slot" style="--x:${bed.x/5.6}%;--y:${bed.y/4.4}%" data-slot="${i}" aria-label="${garden.plants[i]?'Replace':'Plant in'} ${bed.name} position">${glyph(garden.plants[i]?'undo':'leaf')}</button>`).join(''):'');
 q('.bottle-wrap').classList.toggle('target-ready',Boolean(selected));
 document.querySelectorAll('[data-kind]').forEach(b=>{b.setAttribute('aria-pressed',String(selected?.kind===b.dataset.kind&&selected?.type===b.dataset.type));b.classList.toggle('added',b.dataset.kind==='creature'&&garden.creatures.includes(b.dataset.type));b.classList.toggle('suggest',garden.stage==='soil');});
 q('#sprayer').classList.toggle('suggest',garden.stage==='care'&&garden.sprays===0);q('#undo').disabled=!history.length;
 q('#growth-dots').innerHTML=Array.from({length:10},(_,i)=>`<i class="growth-dot ${i<garden.sprays?'filled':''}"></i>`).join('');q('#growth-dots').hidden=garden.stage!=='care';
}
function commit(action){const before=copy(garden);if(!gardenAct(garden,action))return false;history.push(before);if(history.length>80)history.shift();selected=null;clearTimeout(mistTimer);render(action.kind==='water');if(before.stage!==garden.stage){const target=garden.stage==='plants'?q('#plant-panel button'):garden.stage==='creatures'?q('#creature-panel button'):q('#sprayer');target?.focus({preventScroll:true});}if(action.kind==='water'){mistTimer=setTimeout(()=>render(),1100);announce('Water sprayed. The plants have grown.');}else announce(`Step: ${garden.stage}.`);return true;}
function begin(item,force=false){const before=copy(garden);if(!gardenAct(garden,{kind:'pickup',type:item.kind}))return false;if(before.stage!==garden.stage){history.push(before);if(history.length>80)history.shift();}selected=!force&&selected?.kind===item.kind&&selected?.type===item.type?null:item;clearTimeout(mistTimer);render();announce(selected?`${item.kind} selected. Place it into the jar.`:'Object put down.');return true;}
function apply(slot){if(garden.stage==='care'){commit({kind:'water'});return;}if(!selected)return;if(selected.kind==='plant'){slot=slot??garden.plants.findIndex(p=>!p);if(slot<0)slot=1;}commit({...selected,slot});}
document.addEventListener('click',e=>{if(suppress){suppress=false;return;}const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.kind){begin({kind:b.dataset.kind,type:b.dataset.type});return;}
 if(b.dataset.slot!==undefined){apply(Number(b.dataset.slot));return;}if(b.classList.contains('jar-target')){apply();return;}
 if(b.id==='sprayer'){begin({kind:'water'});return;}
 if(b.id==='undo'&&history.length){garden=history.pop();selected=null;clearTimeout(mistTimer);render();return;}
 if(b.id==='reset'){q('#reset-picture').innerHTML=gardenJar(newGarden());q('#reset-dialog').showModal();return;}
 if(b.id==='cancel-reset'){q('#reset-dialog').close();return;}if(b.id==='confirm-reset'){q('#reset-dialog').close();clearTimeout(mistTimer);garden=newGarden();history=[];selected=null;render();}
});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-kind],#sprayer');if(!b||b.disabled||e.button!==0)return;drag={x:e.clientX,y:e.clientY,item:b.id==='sprayer'?{kind:'water'}:{kind:b.dataset.kind,type:b.dataset.type},active:false};});
document.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.active&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){if(!begin(drag.item,true)){drag=null;return;}drag.active=true;}if(drag.active){e.preventDefault();q('#carried').innerHTML=drag.item.kind==='water'?sprayer():drag.item.kind==='soil'?trowel(drag.item.type):drag.item.kind==='plant'?pottedPlant(drag.item.type):bugBox(drag.item.type);q('#carried').classList.add('active');q('#carried').style.left=`${e.clientX}px`;q('#carried').style.top=`${e.clientY}px`;}},{passive:false});
document.addEventListener('pointerup',e=>{if(drag?.active){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.plant-slot,.jar-target');if(target)apply(target.dataset.slot===undefined?undefined:Number(target.dataset.slot));suppress=true;setTimeout(()=>suppress=false,0);}drag=null;q('#carried').classList.remove('active');});
document.addEventListener('pointercancel',()=>{drag=null;q('#carried').classList.remove('active');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;render();}if(e.key==='z'&&(e.ctrlKey||e.metaKey)&&!q('dialog[open]')){e.preventDefault();q('#undo').click();}});
window.addEventListener('resize',fit);render();fit();
</script></body></html>
