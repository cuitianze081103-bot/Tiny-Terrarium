<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8eee5"><meta name="description" content="A quiet, wordless terrarium game. Pick up little things. Make a living world."><title>Tiny Terrarium · Greenhouse</title><link rel="stylesheet" href="game.css"></head><body>
<main id="game" aria-label="Terrarium greenhouse game">
<div class="room-light" aria-hidden="true"></div><div class="window window-one" aria-hidden="true"></div><div class="window window-two" aria-hidden="true"></div>
<header class="topbar"><div class="seal" id="seal" aria-hidden="true"></div><div class="utilities"><button id="undo" class="round-button" aria-label="Undo last action"></button><button id="reset" class="round-button" aria-label="Start a new terrarium"></button></div></header>
<section class="workshop" aria-label="Greenhouse workbench">
<aside class="plant-cabinet" aria-label="Plant cabinet"><div class="cabinet-crown" aria-hidden="true"></div><div id="plant-shelf" class="plant-shelf"></div><div class="cabinet-feet" aria-hidden="true"></div></aside>
<section class="bottle-station" aria-label="Terrarium work area"><div class="lamps" id="lamps" role="group" aria-label="Choose light brightness"></div><div class="light-cone" id="light-cone" aria-hidden="true"></div><div class="jar-halo" aria-hidden="true"></div><div class="bottle-wrap"><div id="bottle" class="bottle"></div><div id="drop-targets" class="drop-targets"></div><div id="effect" class="effect" aria-hidden="true"></div></div><div class="bottle-coaster" aria-hidden="true"></div><div class="care-readings" id="readings" aria-hidden="true"></div></section>
<aside class="supplies" aria-label="Creatures and watering tools"><div class="insect-cabinet"><div id="creature-boxes" class="creature-boxes"></div><div class="small-shelf" aria-hidden="true"></div></div><button id="sprayer" class="sprayer object-button" aria-label="Pick up water sprayer" aria-pressed="false"></button><div class="tool-shadow" aria-hidden="true"></div></aside>
<section class="soil-drawer" aria-label="Soils and trowel"><button id="trowel" class="trowel object-button" aria-label="Pick up trowel" aria-pressed="false"></button><div id="soils" class="soils" role="group" aria-label="Choose soil"></div></section>
<div class="time-dock" id="time-dock"><div class="week-orbit" id="week-orbit" aria-hidden="true"></div><div class="time-buttons"><button id="day" class="round-button" aria-label="Advance one day"></button><button id="play" class="round-button" aria-label="Play time" aria-pressed="false"></button></div></div>
</section><div class="bench-edge" aria-hidden="true"></div><div class="floor" aria-hidden="true"></div><div id="carried" class="carried" aria-hidden="true"></div><div id="visual-cue" class="visual-cue" aria-hidden="true"></div><div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="reset-dialog" aria-label="Start over? This clears your terrarium"><div id="reset-picture" class="reset-picture" aria-hidden="true"></div><div class="dialog-actions"><button id="cancel-reset" class="round-button" aria-label="Keep current terrarium"></button><button id="confirm-reset" class="round-button" aria-label="Confirm new terrarium"></button></div></dialog>
<dialog id="week-dialog" aria-label="Your first week is complete"><div id="week-picture" class="week-picture" aria-hidden="true"></div><div id="week-marks" class="week-marks" aria-hidden="true"></div><div class="dialog-actions"><button id="continue" class="round-button" aria-label="Continue caring for this terrarium"></button></div></dialog>
</main><script type="module" src="game.js"></script></body></html>
