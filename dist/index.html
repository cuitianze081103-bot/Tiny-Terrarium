<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8eee5"><meta name="description" content="A quiet terrarium game for desktop. Pick up little things. Make a living world."><title>Tiny Terrarium · Potting Table</title><link rel="stylesheet" href="game.css"><link rel="stylesheet" href="desktop.css"><link rel="stylesheet" href="wordless.css"></head><body class="wordless">
<main id="game" aria-label="Terrarium greenhouse game">
<div class="room-light" aria-hidden="true"></div><div class="window window-one" aria-hidden="true"></div><div class="window window-two" aria-hidden="true"></div>
<header class="topbar"><div class="seal" id="seal" aria-hidden="true"></div><div class="utilities"><button id="undo" class="round-button" aria-label="Undo last action"></button><button id="reset" class="round-button" aria-label="Start a new terrarium"></button></div></header>
<section class="workshop" aria-label="Greenhouse workbench">
<aside class="plant-cabinet" aria-label="Plant cabinet"><div class="cabinet-crown" aria-hidden="true"></div><div id="plant-shelf" class="plant-shelf"></div><div class="cabinet-feet" aria-hidden="true"></div></aside>
<section class="bottle-station" aria-label="Terrarium work area"><div class="lamps" id="lamps" aria-hidden="true"></div><div class="light-cone" id="light-cone" aria-hidden="true"></div><div class="jar-halo" aria-hidden="true"></div><div class="bottle-wrap"><div id="bottle" class="bottle"></div><div id="drop-targets" class="drop-targets"></div><div id="effect" class="effect" aria-hidden="true"></div></div><div class="bottle-coaster" aria-hidden="true"></div><div class="care-readings" id="readings" aria-hidden="true"></div></section>
<aside class="supplies" aria-label="Creatures and watering tools"><div class="insect-cabinet"><div id="creature-boxes" class="creature-boxes"></div><div class="small-shelf" aria-hidden="true"></div></div><div class="dimmer-housing"><div id="light-dial" class="light-dial" role="slider" tabindex="0" aria-label="Lamp brightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50 percent"></div></div><button id="sprayer" class="sprayer object-button" aria-label="Pick up water sprayer" aria-pressed="false"></button><div class="tool-shadow" aria-hidden="true"></div></aside>
<section class="soil-drawer" aria-label="Soils and trowel"><button id="trowel" class="trowel object-button" aria-label="Pick up trowel" aria-pressed="false"></button><div id="soils" class="soils" role="group" aria-label="Choose soil"></div></section>
<div class="time-dock" id="time-dock"><div class="week-orbit" id="week-orbit" aria-hidden="true"></div><div id="time-status" class="time-status">Plant to begin</div><div class="time-buttons"><button id="day" class="time-button" aria-label="Advance one day"><span id="day-icon" aria-hidden="true"></span><span>Next day</span></button><button id="play" class="time-button play-button" aria-label="Play time" aria-pressed="false"><span id="play-icon" aria-hidden="true"></span><span id="play-label">Auto play</span></button></div></div>
</section><div class="bench-edge" aria-hidden="true"></div><div class="floor" aria-hidden="true"></div><div id="carried" class="carried" aria-hidden="true"></div><div id="visual-cue" class="visual-cue" aria-hidden="true"></div><div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="reset-dialog" aria-label="Start over? This clears your terrarium"><div id="reset-picture" class="reset-picture" aria-hidden="true"></div><div class="dialog-actions"><button id="cancel-reset" class="round-button" aria-label="Keep current terrarium"></button><button id="confirm-reset" class="round-button" aria-label="Confirm new terrarium"></button></div></dialog>
<dialog id="week-dialog" aria-labelledby="week-title"><div class="settlement-art"><div id="week-picture" class="week-picture" aria-hidden="true"></div><div id="week-marks" class="week-marks" aria-hidden="true"></div></div><div class="settlement-copy"><p class="result-eyebrow">YOUR FIRST SEVEN DAYS</p><h1 id="week-title"></h1><p id="week-summary"></p><dl id="week-stats" class="week-stats"></dl><p id="week-advice" class="week-advice"></p><div class="dialog-actions"><button id="continue" class="result-continue" aria-label="Continue caring for this terrarium">Continue growing <span id="continue-icon" aria-hidden="true"></span></button></div></div></dialog>
</main><script type="module" src="game.js"></script></body></html>
